<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time News Authentication</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <header>
        <h1>Real-Time News Authentication</h1>
    </header>
    <main>
        <section id="news-feed">
            <h2>Live News Feed</h2>
            <div id="news-container"></div>
        </section>
        <section id="custom-check">
            <h2>Check Custom News</h2>
            <input type="text" id="custom-news" placeholder="Enter custom news article">
            <button onclick="verifyCustomNews()">Verify Custom News</button>

            <p id="result"></p>
        </section>
    </main>
</body>
</html>
